<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1f0ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <title>Pair with vindu</title>
  <!-- the pairing page: the code, once; the page it opens is the one to keep on the Home Screen. Nothing loaded from elsewhere. -->
  <style>
    :root { color-scheme: light dark; --ink: light-dark(#0b0b0b, #f0efec); --ink-2: light-dark(#52514e, #c3c2b7); --muted: #898781; --line: light-dark(#d6d5cf, #353533);
      --desk: light-dark(#f1f0ec, #0d0d0d); --pane: light-dark(#fcfcfb, #1a1a19); --accent: light-dark(#2a78d6, #3987e5); --bad: light-dark(#c4342d, #ff7b72); }
    html, body { margin: 0; background: var(--desk); color: var(--ink); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { box-sizing: border-box; min-height: 100dvh; display: grid; align-items: center; justify-items: center;
      padding: max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
    main { width: 100%; max-width: 380px; display: grid; gap: 16px; }
    .mark { width: 64px; height: 64px; margin-bottom: 4px; filter: drop-shadow(0 8px 14px rgb(0 0 0 / 18%)); }
    h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--ink-2); }
    code { font: 15px ui-monospace, Menlo, monospace; }
    form { display: grid; gap: 14px; margin-top: 6px; }
    label { display: grid; gap: 6px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
    input { box-sizing: border-box; width: 100%; min-height: 52px; font: inherit; font-weight: 400; color: var(--ink); background: var(--pane); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    #code { font: 600 30px ui-monospace, Menlo, monospace; letter-spacing: 0.35em; text-align: center; padding-left: calc(16px + 0.35em); }
    button { min-height: 52px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 14px; padding: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:active { filter: brightness(0.92); }
    button:disabled { opacity: 0.6; }
    #note { min-height: 1.45em; font-size: 15px; color: var(--bad); }
    #note:empty { min-height: 0; }
    .then { font-size: 15px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="bg-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d3d3a"/><stop offset="1" stop-color="#141413"/></linearGradient><linearGradient id="tile-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eaaff"/><stop offset="1" stop-color="#2a78d6"/></linearGradient></defs><rect width="512" height="512" rx="114" fill="url(#bg-fill)"/><rect x="120" y="120" width="120" height="120" rx="34" fill="#f6f5f1"/><rect x="272" y="120" width="120" height="120" rx="34" fill="#f6f5f1"/><rect x="120" y="272" width="120" height="120" rx="34" fill="#f6f5f1"/><rect x="272" y="272" width="120" height="120" rx="34" fill="url(#tile-fill)"/></svg>
    <h1>Pair with vindu</h1>
    <p>Type the code vindu gave you: on its computer, under Phone; on a Pi, from <code>vindu pair</code>.</p>
    <form id="pair">
      <label>Code <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" enterkeyhint="next" required></label>
      <label>This device's name <input id="name" maxlength="40" placeholder="My phone" autocomplete="off" enterkeyhint="go" required></label>
      <p id="note" role="status"></p>
      <button>Pair</button>
    </form>
    <p class="then">Then keep the page that opens on your Home Screen: vindu opens from there like an app.</p>
  </main>
  <script src="pair.js"></script>
</body>
</html>
