<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#232321" media="(prefers-color-scheme: dark)">
  <title>Views on this phone</title>
  <!-- the phone window: the task the computer shows, its panes one after another; answers, pointing and captures go back.
       Served by the app itself (its token is in this page's address); nothing else is loaded. -->
  <style>
    :root { color-scheme: light dark; --ink: #1f1e1b; --muted: #6b6a64; --line: #d9d8d0; --accent: #2366c4; --wash: #f4f3ee; --page: #fcfcfb; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ecebe4; --muted: #a3a29b; --line: #383835; --accent: #5596e5; --wash: #232321; --page: #1a1a19; } }
    html, body { margin: 0; height: 100%; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--page); }
    body { display: flex; flex-direction: column; height: 100dvh; } [hidden] { display: none !important; }
    #status { flex: none; margin: 0; padding: calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left)); background: var(--wash); border-bottom: 1px solid var(--line); color: var(--muted); }
    body { padding-bottom: env(safe-area-inset-bottom); box-sizing: border-box; } /* the screen's own edges: a notch, the home indicator */
    #you, #captures, #asks { padding-left: calc(16px + env(safe-area-inset-left)) !important; padding-right: calc(16px + env(safe-area-inset-right)) !important; }
    #you input { font-size: 16px; } /* a phone zooms into anything smaller */
    #you { flex: none; display: flex; gap: 8px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--muted); }
    #you input { flex: 1; min-width: 0; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); color: var(--ink); }
    #captures { flex: none; display: grid; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .cap { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    .cap-what { min-width: 0; overflow-wrap: anywhere; }
    .primary, .pad-bar button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--wash); color: var(--ink); white-space: nowrap; }
    .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    label.primary input { display: none; }
    #views { flex: 1; min-height: 0; position: relative; } #views .task { position: absolute; inset: 0; } /* the shell scrolls its own panes */
    .none { padding: 24px 16px; color: var(--muted); }
    #asks { flex: none; display: grid; gap: 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); max-height: 60dvh; overflow: auto; background: var(--wash); }
    .ask { display: grid; gap: 8px; } .ask p { margin: 0; } .ask pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
    .ask-op { font: 13px/1.4 ui-monospace, Menlo, monospace; color: var(--muted); overflow-wrap: anywhere; } .ask-title { font-weight: 600; }
    .ask-label, .hint { color: var(--muted); font-size: 13px; } .ask-error { color: #c4342d; }
    .ask-field { display: grid; gap: 4px; } .ask-field input, .ask-field select, .ask-field textarea { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--page); color: var(--ink); }
    .ask-field input[type=checkbox] { justify-self: start; }
    .ask-opts { display: flex; flex-wrap: wrap; gap: 8px; } .plain { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--page); color: var(--ink); }
    .ask button:disabled { opacity: 0.5; }
    .pad { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--page); }
    .pad p { margin: 0; } .pad canvas { width: 100%; aspect-ratio: 5 / 2; background: #fff; border: 1px solid var(--line); border-radius: 8px; touch-action: none; }
    .pad-bar { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>
  <p id="status">Connecting to the computer…</p>
  <label id="you">Your name <input id="who" autocomplete="name" placeholder="Who answers here"></label>
  <div id="captures" hidden aria-label="What a slot waits for from you"></div>
  <section id="asks" hidden aria-label="What the task asks you"></section>
  <main id="views"><p class="none">Nothing is shown on the computer yet.</p></main>
  <script src="phone.js" defer></script>
</body>
</html>
